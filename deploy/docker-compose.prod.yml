services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      # Local/dev can keep trust auth in base compose; production uses password auth here.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    restart: unless-stopped
    ports: []
    environment:
      DATABASE_URL: ${DATABASE_URL}
      FLASK_DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy

  membership-service:
    restart: unless-stopped
    ports: []
    environment:
      DATABASE_URL: ${DATABASE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      FLASK_DEBUG: "false"
    depends_on:
      user-service:
        condition: service_started
      postgres:
        condition: service_healthy

  payment-service:
    restart: unless-stopped
    ports: []
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MEMBERSHIP_SERVICE_URL: ${MEMBERSHIP_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      FLASK_DEBUG: "false"
    depends_on:
      membership-service:
        condition: service_started
      notification-service:
        condition: service_started
      postgres:
        condition: service_healthy

  notification-service:
    restart: unless-stopped
    ports: []
    environment:
      DATABASE_URL: ${DATABASE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      FLASK_DEBUG: "false"
    depends_on:
      user-service:
        condition: service_started
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_started
      membership-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
    ports:
      - "80:80"
      # Add "443:443" and TLS cert mounts when certificates are provisioned.
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  migration-runner:
    build:
      context: .
      dockerfile: deploy/migration-runner.Dockerfile
    profiles: ["migrations"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
