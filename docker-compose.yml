services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devops
      POSTGRES_DB: devops_lab
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  user-service:
    build: ./user-service
    environment:
      DATABASE_URL: postgresql+psycopg2://devops@postgres:5432/devops_lab
      FLASK_DEBUG: "false"
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  membership-service:
    build: ./membership-service
    environment:
      DATABASE_URL: postgresql+psycopg2://devops@postgres:5432/devops_lab
      USER_SERVICE_URL: http://user-service:5001
      FLASK_DEBUG: "false"
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

  payment-service:
    build: ./payment-service
    environment:
      DATABASE_URL: postgresql+psycopg2://devops@postgres:5432/devops_lab
      MEMBERSHIP_SERVICE_URL: http://membership-service:5002
      NOTIFICATION_SERVICE_URL: http://notification-service:5004
      FLASK_DEBUG: "false"
    ports:
      - "5003:5003"
    depends_on:
      postgres:
        condition: service_healthy
      membership-service:
        condition: service_started
      notification-service:
        condition: service_started

  notification-service:
    build: ./notification-service
    environment:
      DATABASE_URL: postgresql+psycopg2://devops@postgres:5432/devops_lab
      USER_SERVICE_URL: http://user-service:5001
      FLASK_DEBUG: "false"
    ports:
      - "5004:5004"
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

volumes:
  postgres_data:
