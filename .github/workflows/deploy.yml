name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

jobs:
  deploy-vm-compose:
    if: ${{ env.DEPLOY_HOST != '' && env.DEPLOY_USER != '' && env.DEPLOY_SSH_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VM over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/devops-lab
            cd /opt/devops-lab
            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }} .
            fi
            git fetch origin
            git checkout main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml pull || true
            docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build

            POSTGRES_CONTAINER_ID=$(docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml ps -q postgres)
            if [ -z "${POSTGRES_CONTAINER_ID}" ]; then
              echo "postgres container not found"
              exit 1
            fi

            ATTEMPT=1
            MAX_ATTEMPTS=60
            while [ "${ATTEMPT}" -le "${MAX_ATTEMPTS}" ]; do
              HEALTH_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "${POSTGRES_CONTAINER_ID}")
              if [ "${HEALTH_STATUS}" = "healthy" ]; then
                echo "postgres is healthy"
                break
              fi
              if [ "${HEALTH_STATUS}" = "unhealthy" ]; then
                echo "postgres became unhealthy"
                docker logs "${POSTGRES_CONTAINER_ID}"
                exit 1
              fi
              sleep 2
              ATTEMPT=$((ATTEMPT + 1))
            done

            FINAL_HEALTH_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "${POSTGRES_CONTAINER_ID}")
            if [ "${FINAL_HEALTH_STATUS}" != "healthy" ]; then
              echo "postgres did not become healthy in time (status=${FINAL_HEALTH_STATUS})"
              exit 1
            fi

            docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --profile migrations run --rm migration-runner
            docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml ps
